<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مدیر اشتراک‌ها</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <img src="../icons/icon-48.png" alt="" width="52" height="52">
      <div>
        <h1>مدیر اشتراک‌ها</h1>
        <p>کانال‌های یوتیوب را یک‌جا ببین و دسته‌بندی کن.</p>
      </div>
      <div class="actions">
        <button id="open-dashboard" type="button">داشبورد کامل</button>
        <button id="open-sidebar" class="secondary" type="button">پنل کنار YouTube</button>
      </div>
      <label class="language-setting" for="interface-language"><span>زبان رابط</span>
        <select id="interface-language" aria-label="زبان رابط">
          <option value="fa">فارسی</option>
          <option value="en" selected>English</option>
        </select>
      </label>
    </main>
    <script src="../shared/ui-language.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
